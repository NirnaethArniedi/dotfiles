# ============================================================================
# TPM bootstrap — auto-install plugin manager on first launch
# ============================================================================
if-shell "test ! -d ~/.tmux/plugins/tpm" {
  run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'
  run '~/.tmux/plugins/tpm/bin/install_plugins'
}

# ============================================================================
# Plugins
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'                   # Plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'         # Reasonable defaults
set -g @plugin 'dracula/tmux'                       # Status bar theme
# set -g @plugin 'Ataraxy-Labs/opensessions'          # Session sidebar + agent state
set -g @plugin 'alexwforsythe/tmux-which-key'       # Pop-up key hints (prefix + ?)
# set -g @plugin 'tmux-plugins/tmux-sidebar'        # File-tree sidebar — uncomment if used

# ============================================================================
# Plugin configuration
# ============================================================================
# Dracula status bar
set -g @dracula-plugins        "git battery time"
set -g @dracula-show-powerline "true"
set -g @dracula-show-left-icon "session"           # Left slot shows the session name
set -g @dracula-time-format    "%F %R"

# opensessions — Alt+1..9 jumps to sessions, Alt+s reveals sidebar
# set -g @opensessions-index-keys       "M-1 M-2 M-3 M-4 M-5 M-6 M-7 M-8 M-9"
# set -g @opensessions-focus-global-key "M-s"

# ============================================================================
# Terminal capabilities
# ============================================================================
set-option -a terminal-features 'xterm-256color:RGB'   # True-colour support
set-option -g  extended-keys    on                     # Modern key sequences (CSI u)
set-option -sg escape-time      10                     # Fast Esc for LazyVim
set-option -g  focus-events     on                     # Forward focus events to apps

# ============================================================================
# General behaviour
# ============================================================================
set  -g base-index       1     # Windows start at 1, not 0
setw -g pane-base-index  1     # Panes start at 1, not 0
set  -g status-interval  5     # Status bar refresh interval (seconds)
set  -g mouse            on
setw -g monitor-activity on
set  -g detach-on-destroy off  # Don't detach when closing a session with multiple windows/panes
# ============================================================================
# Repo session bootstrap — editor + agent windows for git repos only
# ============================================================================
set  -g @repo-bootstrap-enabled        "on"
set  -g @repo-bootstrap-editor-command "nvim ."
set  -g @repo-bootstrap-agent-command  "omp"
set-hook -g after-new-session "run-shell -b 'bash \"$HOME/.config/tmux/repo-bootstrap-session.sh\" #{q:session_id} #{q:session_path}'"

# ============================================================================
# Window titles
# Show pane_current_path basename when running nvim, otherwise the command name
# ============================================================================
setw   -g automatic-rename        on
set    -g set-titles              on
set    -g automatic-rename-format "#{?#{==:#{pane_current_command},nvim},#{b:pane_current_path},#{pane_current_command}}"

# ============================================================================
# Pane borders
# ============================================================================
set -g pane-border-status top
set -g pane-border-format " [ ###P #T ]"

# ============================================================================
# Copy mode — vi-style, WSL clipboard integration via clip.exe
# ============================================================================
setw -g mode-keys vi
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "clip.exe"
bind -T copy-mode-vi WheelUpPane       send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane     send-keys -X -N 3 scroll-down

# ============================================================================
# Key bindings — pane navigation without prefix (Alt + arrows)
# ============================================================================
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ============================================================================
# Key bindings — pane navigation with prefix (Ctrl + hjkl)
# Default tmux bindings on C-h/j/k/l are removed first to avoid conflicts
# ============================================================================
unbind-key C-h
unbind-key C-j
unbind-key C-k
unbind-key C-l
bind-key C-h select-pane -L
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-l select-pane -R

# Remove default prefix + C-Arrow resize bindings (unused)
unbind-key C-Up
unbind-key C-Down
unbind-key C-Left
unbind-key C-Right

# ============================================================================
# Key bindings — window navigation without prefix (Shift + arrows)
# ============================================================================
bind -n S-Left  previous-window
bind -n S-Right next-window

# ============================================================================
# Key bindings — splits open at the current pane's path
# ============================================================================
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ============================================================================
# Key bindings — sesh session picker (Alt+n, fzf inside tmux popup)
# Filters: ^a all, ^t tmux only, ^g configs only, ^x zoxide only
# ============================================================================
bind -n M-n display-popup -E -w 80% -h 70% \
  "sesh connect \"\$(
    sesh list -i | fzf --ansi --no-sort \
      --header=\"^a all  ^t tmux  ^g configs  ^x zoxide\" \
      --bind \"ctrl-a:reload(sesh list -i)\" \
      --bind \"ctrl-t:reload(sesh list -t -i)\" \
      --bind \"ctrl-g:reload(sesh list -c -i)\" \
      --bind \"ctrl-x:reload(sesh list -z -i)\"
  )\""

# ============================================================================
# TPM init — MUST be the last line
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

